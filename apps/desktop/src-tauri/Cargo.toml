[package]
name = "smartpet"
version = "0.1.0"
description = "SmartPet 桌面宠物（Tauri 壳）"
authors = ["smartpet-dev"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "smartpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"